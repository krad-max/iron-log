<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Log</title>
<meta name="theme-color" content="#22C55E">
<meta name="description" content="Carnet de musculation personnel : séances, historique, exercices expliqués.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* Direction : carnet de salle, cartes blanches sur fond vert très pâle, accent vert vif, petites étiquettes mono. */
:root{
  --bg:#F2F5F1; --card:#FFFFFF; --line:#E1E6DF; --ink:#111611; --mute:#667066;
  --accent:#22C55E; --accent-ink:#052E16; --soft:#E8F7EC; --danger:#D92D3F; --star:#F2AE00; --field:#F4F6F3;
  --tN:#5E665E; --tW:#E8890C; --tD:#DC2D3F; --tC:#8B3FE0; --tA:#1FB257; --tE:#2F6FE4; --tF:#C01B36;
  --tR:#0E8F9B; --tM:#D2338A; --tG:#5B6B85; --tI:#A16207;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E0B; --card:#151A15; --line:#263026; --ink:#EEF3EE; --mute:#8D988D;
    --accent:#34D369; --accent-ink:#04200E; --soft:#12301C; --danger:#FF6272; --field:#0F130F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E0B; --card:#151A15; --line:#263026; --ink:#EEF3EE; --mute:#8D988D;
  --accent:#34D369; --accent-ink:#04200E; --soft:#12301C; --danger:#FF6272; --field:#0F130F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#app{height:100%}
.shell{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
@media (min-width:900px){.shell{max-width:720px}body{font-size:16px}}
@media (min-width:1300px){.shell{max-width:860px}}
@media (min-width:900px){.panel{max-width:620px}}
.main{flex:1;min-height:0;overflow-y:auto;padding-bottom:14px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}

.label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.label.g{color:var(--accent)}
h1{font-size:28px;letter-spacing:-.02em;margin:2px 0 0;font-weight:700}
.page-head{padding-top:22px;padding-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.sec{margin-top:22px}
.sec>.label{display:block;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.b{font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;font-weight:600;padding:0 16px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--card);border:1px solid var(--line);color:var(--danger)}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;font-size:18px;color:var(--ink)}
.iconbtn.sm{width:34px;height:34px;color:var(--mute)}
.iconbtn:active{background:var(--field)}
.iconbtn:disabled{opacity:.28;cursor:default}
.link{color:var(--accent);font-size:12.5px;font-weight:500}
.dashed{display:flex;align-items:center;justify-content:center;height:40px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-size:12.5px;font-weight:600;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-right:0;padding-right:0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--mute)}
.chip[data-on="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{width:100%;height:46px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{height:auto;padding:12px 14px;resize:vertical}
select.sel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}

/* Navigation */
.nav{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 0 8px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;font-size:10.5px;font-weight:500;color:var(--mute)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.nav svg{width:22px;height:22px}

/* Bibliothèque */
.libhead{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:20px;padding-bottom:10px}
.exrow{display:block;width:100%;padding:14px 16px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:14px;height:14px;fill:var(--line)}
.stars svg.on{fill:var(--star)}
.gauge{display:inline-flex;align-items:flex-end;gap:3px;height:16px}
.gauge i{width:4px;border-radius:2px;background:var(--line)}
.gauge[data-v="1"] i.on{background:#2DB36A}.gauge[data-v="2"] i.on{background:#8CBF2C}.gauge[data-v="3"] i.on{background:#E3A30F}
.gauge[data-v="4"] i.on{background:#EA7A1B}.gauge[data-v="5"] i.on{background:#DC3B3B}
.initials{width:34px;height:34px;flex:none;border-radius:10px;background:var(--field);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--mute)}

/* Éditeur */
.edhead{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:2px;padding:10px 0 8px}
.edtitle{flex:1;min-width:0;margin:0 4px}
.nameinput{width:100%;border:0;background:transparent;font-size:19px;font-weight:700;letter-spacing:-.01em;padding:0;outline:none;color:var(--ink)}
.stats{padding:12px 14px 10px;margin-top:4px}
.stats .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--field);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;font-weight:600}
.exlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.excard{padding:12px 12px 12px;position:relative;background:var(--card)}
.excard.dragging,.setwrap.dragging{z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:none}
.excard:not(.dragging),.setwrap:not(.dragging){transition:transform .15s}
.sstag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--tC);margin:-2px 0 6px 2px}
.excard[data-ss="1"]{border-left:3px solid var(--tC)}
.exhead{display:flex;align-items:center;gap:6px}
.grip{width:26px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);touch-action:none;cursor:grab;font-size:15px;letter-spacing:-2px}
.exname{flex:1;min-width:0;font-weight:600;font-size:15.5px;line-height:1.25;padding:2px 2px}
.meta{display:flex;gap:14px;align-items:center;margin:8px 0 10px 2px;flex-wrap:wrap}
.meta button,.meta span.m{display:inline-flex;gap:6px;align-items:baseline}
.meta b{font-size:12.5px;font-weight:600}
.sethead,.setrow{display:grid;grid-template-columns:22px 72px 54px minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;align-items:center}
.sethead{padding:0 2px 4px}
.sethead .label{font-size:9px;text-align:center}
.setwrap{background:var(--card);border-radius:10px;position:relative;overflow:hidden;touch-action:pan-y}
.setwrap.dragging{overflow:visible}
.setrow{padding:3px 2px;position:relative;background:var(--card);transition:transform .15s}
.setrow.sw{transition:none}
.swbg{position:absolute;left:0;right:0;top:0;background:var(--danger);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-size:12px;font-weight:600;opacity:0}
.setrow .n{font-family:var(--mono);font-size:12px;color:var(--mute);text-align:center}
.setrow .prev{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{display:inline-flex;align-items:center;justify-content:center;height:26px;border-radius:8px;font-family:var(--mono);font-size:10px;color:var(--ink);border:1px solid var(--line);padding:0 4px;width:100%;overflow:hidden;white-space:nowrap}
.tp[data-t="normal"]{color:var(--mute)}
.tp:not([data-t="normal"]){border-color:transparent;color:#fff}
.num{width:100%;height:38px;border:1px solid var(--line);background:var(--field);border-radius:10px;text-align:center;font-weight:600;font-size:16px;outline:none;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.num:focus{border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px 10px;padding:2px 2px 8px;flex-wrap:wrap;justify-content:space-between}
.sg{display:flex;align-items:center;gap:6px}
.sb{width:46px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.sb:active{background:var(--soft);border-color:var(--accent)}
.stepper .chip{padding:6px 11px;font-size:12px}
.stepper2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 2px 8px}
.stepper2 .chip{padding:5px 10px;font-size:12px}
.prline{font-size:11.5px;padding:0 2px 4px 30px;color:var(--mute);display:flex;gap:10px;align-items:center}
.prline:empty{display:none}
.prline .pr{color:var(--star);font-weight:700}
.sug{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:9px 12px;border-radius:12px;background:var(--soft);font-size:12.5px;line-height:1.35}
.sug .sp{min-width:0}
.sug.warn{background:var(--field);border:1px solid var(--line)}
.sug button.link{flex:none;font-weight:600;padding:4px 2px}
.rtbar{flex:none;margin:0 0 8px;padding:10px 12px;border-radius:16px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.rtbar .t{font-family:var(--mono);font-size:22px;font-weight:600;min-width:62px;font-variant-numeric:tabular-nums}
.rtbar .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.rtbar button{height:34px;padding:0 11px;border-radius:10px;border:1px solid rgba(128,128,128,.45);font-size:13px;font-weight:600;color:inherit}
.rtbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .5s linear}
.platebar{display:flex;align-items:center;justify-content:center;gap:3px;height:70px;margin:12px 0}
.platebar i{display:block;border-radius:3px;background:var(--ink);width:12px}
.platebar .bar{height:8px;width:46px;border-radius:2px;background:var(--mute)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:2px;justify-content:center;padding:4px 0}
.hm i{display:block;border-radius:3px;background:var(--field);border:1px solid var(--line)}
.hm i[data-l="1"]{background:color-mix(in srgb,var(--accent) 28%,var(--card));border-color:transparent}
.hm i[data-l="2"]{background:color-mix(in srgb,var(--accent) 52%,var(--card));border-color:transparent}
.hm i[data-l="3"]{background:color-mix(in srgb,var(--accent) 76%,var(--card));border-color:transparent}
.hm i[data-l="4"]{background:var(--accent);border-color:transparent}
.hm i[data-l="x"]{visibility:hidden}
.hm i.sel{outline:2px solid var(--ink);outline-offset:1px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--field);stroke-width:9}
.ring .fgc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-variant-numeric:tabular-nums}
.mbar{display:grid;grid-template-columns:84px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.mbar .tr{position:relative;height:10px;border-radius:5px;background:var(--field)}
.mbar .tg{position:absolute;top:-2px;bottom:-2px;border-radius:4px;background:var(--soft);border:1px dashed var(--accent);opacity:.8}
.mbar .fl{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.mbar b{text-align:right;font-variant-numeric:tabular-nums}
.exline{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-bottom:1px solid var(--line)}
.exline:last-child{border-bottom:0}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart .ch-grid{stroke:var(--line);stroke-width:1}
.chart .ch-line{stroke:var(--accent);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ch-pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .ch-pt.on{stroke:var(--ink)}
.chart .ch-t{fill:var(--mute);font:10px var(--mono)}
.chart .hit{fill:transparent;cursor:pointer}
.tip{min-height:38px;font-size:13px;padding:8px 2px}
.wkdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--mute)}
.wd b{width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border:1.5px solid var(--line);color:var(--mute)}
.wd[data-s="done"] b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd[data-s="missed"] b{border-color:var(--danger);color:var(--danger)}
.wd[data-s="today"] b,.wd[data-s="today-done"] b{border-color:var(--ink);color:var(--ink)}
.wd[data-s="today-done"] b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd[data-s="rest"] b{border-style:dashed;opacity:.6}
.gbar{height:8px;border-radius:5px;background:var(--field);position:relative;overflow:hidden;margin:8px 0 4px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dn{font-family:var(--mono);font-size:10px;color:var(--mute);text-align:center;padding-bottom:2px}
.cd{height:36px;border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums;text-align:center;background:var(--field);color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.cd[data-l="1"]{background:color-mix(in srgb,var(--accent) 28%,var(--card));color:var(--ink)}
.cd[data-l="2"]{background:color-mix(in srgb,var(--accent) 52%,var(--card));color:var(--ink)}
.cd[data-l="3"]{background:color-mix(in srgb,var(--accent) 76%,var(--card));color:var(--accent-ink)}
.cd[data-l="4"]{background:var(--accent);color:var(--accent-ink)}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.cd.sel{box-shadow:0 0 0 2px var(--ink)}
.cd.blank{visibility:hidden}
.chart .ch-trend{stroke:var(--mute);fill:none;stroke-width:2;stroke-dasharray:5 4}
.bm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.bm svg{width:100%;height:auto;display:block}
.bm .sil{fill:var(--field);stroke:var(--line);stroke-width:1.5}
.bm .rg{fill:var(--field);stroke:var(--line);stroke-width:1;cursor:pointer}
.bm .rg[data-l="1"]{fill:color-mix(in srgb,var(--accent) 28%,var(--card))}
.bm .rg[data-l="2"]{fill:color-mix(in srgb,var(--accent) 55%,var(--card))}
.bm .rg[data-l="3"]{fill:var(--accent)}
.bm .rg[data-l="4"]{fill:var(--tW)}
.bm .rg.sel{stroke:var(--ink);stroke-width:2.5}
.bm .vl{font-family:var(--mono);font-size:9px;fill:var(--mute);text-anchor:middle}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;text-align:center;display:inline-flex;align-items:center;justify-content:center;height:34px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--mute)}
.seg button[data-on="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--field)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px;font-family:var(--mono)}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cmp .ph{aspect-ratio:3/4}
.cmp .ph.none{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.hm.y{grid-template-rows:repeat(7,6px);grid-auto-columns:6px;gap:1px}
.hm.y i{border-radius:2px}
.cd[data-ty]{--tc:var(--accent)}
.cd[data-ty="pull"]{--tc:var(--tE)}
.cd[data-ty="legs"]{--tc:var(--tW)}
.cd[data-ty="mix"]{--tc:var(--tG)}
.cd[data-ty][data-l="1"]{background:color-mix(in srgb,var(--tc) 35%,var(--card))}
.cd[data-ty][data-l="2"]{background:color-mix(in srgb,var(--tc) 58%,var(--card))}
.cd[data-ty][data-l="3"]{background:color-mix(in srgb,var(--tc) 80%,var(--card));color:#fff}
.cd[data-ty][data-l="4"]{background:var(--tc);color:#fff}
.legend.lg span[data-ty="push"]::before{background:var(--accent)}
.legend.lg span[data-ty="pull"]::before{background:var(--tE)}
.legend.lg span[data-ty="legs"]::before{background:var(--tW)}
.legend.lg span[data-ty="mix"]::before{background:var(--tG)}
.hfilters{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0}
.nrg{display:flex;gap:6px;margin:6px 0}
.nrg button{flex:1;height:38px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;color:var(--mute)}
.nrg button[data-on="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.setedit{display:grid;grid-template-columns:24px 1fr 1fr 32px;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.cmpcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-size:13px}
.cmpcols div div{padding:2px 0}
.nav{grid-template-columns:repeat(6,1fr)}
.nav button{font-size:10px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.cm{max-width:92%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line)}
.cm.u{align-self:flex-end;background:var(--soft);border-color:transparent}
.cm.err{border-color:var(--danger);color:var(--danger)}
.cm .scard{margin-top:8px;padding:10px;border-radius:12px;background:var(--field)}
.adv{padding:12px 14px;margin-top:8px}
.adv .row{gap:8px;margin-top:10px}
.adv .row button{flex:1}
.risk{color:var(--tW);font-size:13px;font-weight:700}
.wtag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tW);margin-left:6px}
.mile{padding:10px 0;border-bottom:1px solid var(--line)}
.mile:last-child{border:0}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mchips span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink);border:1px solid var(--accent)}
.shimg{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.inj{padding:12px 0;border-bottom:1px solid var(--line)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dg.one{grid-template-columns:minmax(0,260px);justify-content:center}
.dg figure{margin:0;text-align:center}
.dg svg{width:100%;height:auto;display:block;color:var(--ink);background:var(--field);border-radius:12px}
.dg figcaption{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);padding:2px 6px}
.legend span::before{content:"";display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend.lg span::before{width:12px;height:12px;border:0;border-radius:3px;background:var(--field)}
.legend.lg span[data-l="1"]::before{background:color-mix(in srgb,var(--accent) 28%,var(--card))}
.legend.lg span[data-l="2"]::before{background:color-mix(in srgb,var(--accent) 55%,var(--card))}
.legend.lg span[data-l="3"]::before{background:var(--accent)}
.legend.lg span[data-l="4"]::before{background:var(--tW)}
.legend span.t::before{border-top:2px dashed var(--mute)}
select.field{appearance:auto}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumrow:last-child{border-bottom:0}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:700}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drops{display:flex;flex-direction:column;gap:4px;padding:2px 2px 6px 24px}
.drop{display:grid;grid-template-columns:18px minmax(0,1fr) 14px minmax(0,1fr) 28px;gap:6px;align-items:center}
.drop .num{height:32px;font-size:14px}
.drop .x{color:var(--mute);text-align:center;font-size:12px}
.sets{display:flex;flex-direction:column;margin-bottom:8px}
.edfoot{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:10px 0 6px}
.empty{padding:26px 18px;text-align:center;color:var(--mute);font-size:14px}

/* Feuilles */
.ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:relative;width:100%;max-width:480px;max-height:90%;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(20px,env(safe-area-inset-left,0px))}
.panel.tall{height:92%}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 10px;flex:none}
.ptitle{font-size:17px;font-weight:700;margin:2px 0 10px}
.pbody{overflow-y:auto;min-height:0;flex:1}
.pfoot{padding-top:10px;display:flex;flex-direction:column;gap:8px;flex:none}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;border-radius:12px}
.trow .sq{width:30px;height:30px;border-radius:8px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.trow .tt{flex:1;min-width:0}
.trow .tt b{display:block;font-size:14.5px}
.trow .tt span{font-size:11.5px;color:var(--mute)}
.trow .ck{color:var(--ink);font-weight:700}
.note{border:1px solid var(--line);border-left:3px solid var(--tF);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:8px 0 4px;background:var(--field)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px}
.opt:last-child{border-bottom:0}
.opt.danger{color:var(--danger)}
.opt[data-on="true"]{color:var(--accent);font-weight:600}
.sec-t{margin:16px 0 6px}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.steps li{display:flex;gap:10px}
ol.steps b{width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
ul.bl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bl li{display:flex;gap:8px}
ul.bl li::before{content:"•";color:var(--accent)}
ul.bl.w li::before{color:var(--danger)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tri>div{border:1px solid var(--line);border-radius:12px;padding:9px 4px}
.tri b{display:block;font-size:15px;margin-top:2px}
.rate{display:flex;gap:6px}
.rate button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);font-weight:600;text-align:center}
.rate button[data-on="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:80;max-width:90%}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:2px 8px}
.tplcard{display:block;width:100%;padding:14px 16px}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line)}
.pickrow .ck{width:24px;height:24px;border-radius:99px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent;flex:none}
.pickrow[data-on="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.altrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const Store={coll:null,timers:{},chains:{},err:null,dirty:{},deleted:{}};
function saveLocal(){try{localStorage.setItem('il-state',JSON.stringify({prefs:S.prefs,templates:S.templates,sessions:S.sessions}))}catch(e){}}
function cloudSet(id,obj){
  if(!Store.coll)return; clearTimeout(Store.timers[id]);
  Store.timers[id]=setTimeout(()=>{Store.chains[id]=(Store.chains[id]||Promise.resolve()).then(()=>Store.coll.doc(id).set(obj)).catch(e=>{Store.err=e;S.storage='error';if(S.tab==='profile'&&!S.editor)render()})},500);
}
function cloudDel(id){if(!Store.coll)return;clearTimeout(Store.timers[id]);Store.chains[id]=(Store.chains[id]||Promise.resolve()).then(()=>Store.coll.doc(id).delete()).catch(()=>{})}
function persist(kind,obj){const id=kind==='prefs'?'prefs':kind+'-'+obj.id;if(!Store.coll){Store.dirty[id]=1;delete Store.deleted[id]}saveLocal();cloudSet(id,kind==='prefs'?S.prefs:obj)}
function remove(kind,id){if(!Store.coll)Store.deleted[kind+'-'+id]=1;saveLocal();cloudDel(kind+'-'+id)}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem('il-state')||'null');if(j){S.prefs=Object.assign(defPrefs(),j.prefs||{});S.templates=j.templates||[];S.sessions=j.sessions||[]}}catch(e){}
  try{const t=localStorage.getItem('il-theme');if(t)setTheme(t,true)}catch(e){}
  try{const st=parseFloat(localStorage.getItem('il-step'));if(STEPS.includes(st))S.step=st}catch(e){}
  rebuildEx();
  try{const r=JSON.parse(localStorage.getItem('il-run')||'null');if(r&&r.draft){r.undo=[];r.redo=[];S.editor=r;S.tab='sessions';startRunSupport()}}catch(e){}}
async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return; const id=await user.id(); if(!id)return;
    Store.coll=db.collection('data/users/'+id);
    const snap=await Store.coll.get();
    if(snap.empty){
      S.storage='cloud'; persist('prefs'); S.templates.forEach(t=>persist('tpl',t)); S.sessions.forEach(s=>persist('ses',s));
    }else{
      /* Fusion : le cloud sert de base, mais ce qui a été modifié ici avant son retour est conservé. */
      const ct={},cs={}; let cp=null;
      snap.docs.forEach(d=>{const v=JSON.parse(JSON.stringify(d.data()));if(d.id==='prefs')cp=v;else if(d.id.startsWith('tpl-'))ct[v.id||d.id.slice(4)]=v;else if(d.id.startsWith('ses-'))cs[v.id||d.id.slice(4)]=v});
      const merge=(kind,cloud,local)=>{
        const out=[];
        Object.values(cloud).forEach(o=>{if(Store.deleted[kind+'-'+o.id])cloudDel(kind+'-'+o.id);else out.push(o)});
        local.forEach(o=>{const c=cloud[o.id];
          if(!c){out.push(o);persist(kind,o)}
          else if(Store.dirty[kind+'-'+o.id]){out[out.indexOf(c)]=o;persist(kind,o)}});
        return out};
      S.templates=merge('tpl',ct,S.templates).sort((a,b)=>(b.updated||0)-(a.updated||0));
      S.sessions=merge('ses',cs,S.sessions).sort((a,b)=>b.startedAt-a.startedAt);
      if(cp&&!Store.dirty.prefs)S.prefs=Object.assign(defPrefs(),cp); else persist('prefs');
      S.storage='cloud'; saveLocal();
    }
    Store.dirty={};Store.deleted={};
    rebuildEx();
    if(!E())render();
  }catch(e){Store.coll=null;S.storage='local'}
}

/* ───────── Modèle séance ───────── */
function makeItem(exId,n,reps){const e=EXMAP[exId];reps=reps||mid(e.rr.hypertrophy);
  return{exId,rest:e.rest,tempo:'',ss:null,sets:Array.from({length:n||3},()=>({type:'normal',kg:null,reps,done:false}))}}
function newDraft(){return{id:uid(),name:'Nouvelle séance',cycle:'Cycle 1',items:[],updated:Date.now()}}
function fromPreset(p){return{id:uid(),name:p.name,cycle:'Cycle 1',items:p.items.map(([id,n])=>makeItem(id,n)),updated:Date.now()}}
const counted=it=>it.sets.filter(s=>s.type!=='warmup');
function est(d){let t=0;d.items.forEach(it=>{t+=90;it.sets.forEach(()=>{t+=45+(it.rest>0?it.rest:60)})});return t}
function stats(d){return{exos:d.items.length,sets:d.items.reduce((a,it)=>a+counted(it).length,0),dur:est(d)}}
function volume(sets){return sets.reduce((a,s)=>s.type==='warmup'?a:a+(s.kg||0)*(s.reps||0)+(s.drops||[]).reduce((b,x)=>b+(x.kg||0)*(x.reps||0),0),0)}
const e1rm=(kg,reps)=>kg>0&&reps>0?((S.prefs&&S.prefs.formula==='brzycki'&&reps<37)?kg*36/(37-reps):kg*(1+reps/30)):0;
const work=sets=>sets.filter(x=>x.type!=='warmup'&&x.kg>0&&x.reps>0);
const workD=sets=>work(sets.flatMap(x=>x.type==='drop'?[x].concat((x.drops||[]).map(d=>({type:'normal',kg:d.kg,reps:d.reps}))):[x]));
function buildPrev(){PREV={};HIST={};REC={};
  S.sessions.slice().sort((a,b)=>b.startedAt-a.startedAt).forEach(se=>se.entries.forEach(en=>{
    if(!PREV[en.exId])PREV[en.exId]=en.sets;(HIST[en.exId]=HIST[en.exId]||[]).push({t:se.startedAt,sets:en.sets});
    const r=REC[en.exId]=REC[en.exId]||{kg:0,e1:0,at:{},n:0};r.n++;
    workD(en.sets).forEach(x=>{r.kg=Math.max(r.kg,x.kg);r.e1=Math.max(r.e1,e1rm(x.kg,x.reps));r.at[x.kg]=Math.max(r.at[x.kg]||0,x.reps)})}))}
/* Record battu ? Compare avec l'historique et avec les autres séries déjà validées dans cette séance. */
function prKind(it,k){
  const s=it.sets[k];if(s.type==='warmup'||!(s.kg>0&&s.reps>0))return null;
  const h=REC[it.exId];if(!h)return null;
  let best={kg:h.kg,e1:h.e1,at:Object.assign({},h.at)};
  it.sets.forEach((x,j)=>{if(j!==k&&x.done&&x.type!=='warmup'&&x.kg>0&&x.reps>0){best.kg=Math.max(best.kg,x.kg);best.e1=Math.max(best.e1,e1rm(x.kg,x.reps));best.at[x.kg]=Math.max(best.at[x.kg]||0,x.reps)}});
  if(s.kg>best.kg)return 'poids';
  if(e1rm(s.kg,s.reps)>best.e1+0.001)return '1RM';
  if(best.at[s.kg]!=null&&s.reps>best.at[s.kg])return 'reps';
  return null}
const PRL={poids:'Record de poids',  '1RM':'Record de 1RM estimé',reps:'Record de répétitions'};
/* Double progression : on monte les reps dans la fourchette, puis la charge. */
function suggest(exId){
  const h=HIST[exId];if(!h||!h.length)return null;const e=EXMAP[exId];if(!e)return null;
  const w=work(h[0].sets);if(!w.length)return null;
  const m=String((e.rr||{}).hypertrophy||'8-12').match(/(\d+)\D+(\d+)/),lo=m?+m[1]:8,hi=m?+m[2]:12;
  const top=w.reduce((a,x)=>x.kg>a.kg||(x.kg===a.kg&&x.reps>a.reps)?x:a);
  const out={last:top,lo,hi};
  if(top.reps>=hi){out.kg=Math.round((top.kg+S.step)*100)/100;out.reps=lo;out.mode='charge'}else{out.kg=top.kg;out.reps=top.reps+1;out.mode='reps'}
  const f=h.slice(0,3).map(x=>Math.max(0,...work(x.sets).map(y=>e1rm(y.kg,y.reps))));
  out.plateau=h.length>=3&&f[0]<=Math.max(f[1],f[2])+0.001&&f[0]>0;
  return out}

  return l[n]||(w?null:l[l.length-1])||null}

function filterEx(o){
  const q=norm(o.q||'').trim(), muscles=o.group?LGROUPS.find(g=>g.id===o.group).m:null;
  const r=EXOS.filter(e=>{
    if(o.favOnly&&!S.prefs.fav[e.id])return false; if(o.equip&&e.eq!==o.equip)return false; if(stars(e)<(o.minStars||0))return false;
    if(o.mech==='poly'&&!e.m)return false; if(o.mech==='iso'&&e.m)return false;
    if(o.diffF){const d=diff(e);if(o.diffF==='beg'&&d>2)return false;if(o.diffF==='mid'&&d!==3)return false;if(o.diffF==='adv'&&d<4)return false}
    if(muscles&&!e.p.concat(e.s).some(m=>muscles.includes(m)))return false;
    if(q){const hay=norm([e.n].concat(e.al,e.p.map(m=>MUS[m]),[e.eq]).join(' '));if(!q.split(/\s+/).every(t=>hay.includes(t)))return false}
    return true});

  return r.sort(by[o.sort||'stars']);
}

function startPlanned(){
  const pi=planInfo();if(!pi||pi.done)return;const ref=refToday(),d=ref&&refDraft(ref);const dl=pi.deload||(S.prefs.deloadUntil>Date.now());if(!d){toast('Pas de séance prévue aujourd\'hui');return}
  d.cycle=pi.p.name;openEditor(d);A.start();
  const e=E(),f=dl?0.9:(pi.w>0?1+(pi.p.prog||0)/100:1);
  e.draft.items.forEach(it=>{
    if(dl){let c=0;const n=it.sets.filter(x=>x.type!=='warmup').length,keep=Math.max(1,Math.ceil(n*0.6));it.sets=it.sets.filter(x=>x.type==='warmup'||(++c<=keep))}
    if(f!==1)it.sets.forEach(x=>{if(x.type!=='warmup'&&x.kg>0)x.kg=Math.round(x.kg*f/1.25)*1.25})});
  e.plan={w:pi.w,deload:dl};saveRun();render();
  toast(dl?'Semaine de décharge : charges −10 %, séries −40 %':(f!==1?'Charges proposées : +'+fmtN(pi.p.prog)+' % par rapport à la dernière fois':'Bonne séance !'))}

const GK={e1:'1RM estimé',kg:'Charge max',body:'Poids de corps'};
function bodyList(){return (S.prefs.body||[]).slice().sort((a,b)=>a.t-b.t)}
function goalInfo(g){
  let pts,cur,start;
  if(g.kind==='body'){pts=bodyList().filter(x=>x.kg>0).map(x=>({t:x.t,v:x.kg}));cur=pts.length?pts[pts.length-1].v:null;start=pts.length?(pts.filter(x=>x.t>=g.t-DAYMS)[0]||pts[0]).v:null}
  else{pts=exStats(g.exId).map(x=>({t:x.t,v:x[g.kind]})).filter(x=>x.v>0);cur=pts.length?Math.max(...pts.map(x=>x.v)):null;start=pts.length?pts[0].v:null}
  if(cur==null)return{cur:null,pct:0,est:'Pas encore de données.'};
  const up=g.target>=start;let pct=up?(g.target>start?(cur-start)/(g.target-start):1):(start>g.target?(start-cur)/(start-g.target):1);pct=Math.max(0,Math.min(1,pct));
  if(up?cur>=g.target:cur<=g.target)return{cur,pct:1,est:'Objectif atteint 🏆'};
  const rec=pts.filter(x=>x.t>=Date.now()-120*DAYMS);if(rec.length<3||rec[rec.length-1].t-rec[0].t<7*DAYMS)return{cur,pct,est:'Pas assez de données pour estimer la date.'};
  const n=rec.length,mx=rec.reduce((a,x)=>a+x.t/DAYMS,0)/n,my=rec.reduce((a,x)=>a+x.v,0)/n;let sxy=0,sxx=0;rec.forEach(x=>{sxy+=(x.t/DAYMS-mx)*(x.v-my);sxx+=(x.t/DAYMS-mx)**2});
  const sl=sxx?sxy/sxx:0;if(up?sl<=0:sl>=0)return{cur,pct,est:'Tendance actuelle : pas de progression vers l\'objectif.'};
  const days=Math.round(Math.abs(g.target-cur)/Math.abs(sl));if(days>730)return{cur,pct,est:'Au rythme actuel : dans plus de 2 ans.'};
  return{cur,pct,est:'Au rythme actuel : ≈ '+new Date(Date.now()+days*DAYMS).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}}

   <button class="dashed" data-act="body-add" style="margin-top:12px">+ Ajouter une mesure</button></div></div>`;return h}

/* ───────── Calendrier mensuel et équilibre ───────── */
function sessType(se){const c={push:0,pull:0,legs:0};se.entries.forEach(en=>{const e=EXMAP[en.exId];if(!e)return;const n=en.sets.filter(x=>x.type!=='warmup').length,m=e.p[0];if(PUSHM.includes(m))c.push+=n;else if(PULLM.includes(m))c.pull+=n;else if(LEGM.includes(m))c.legs+=n});
  const t=c.push+c.pull+c.legs;if(!t)return'mix';const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return c[k]/t>=0.55?k:'mix'}
function calendarHTML(){
  const now=new Date(),base=new Date(now.getFullYear(),now.getMonth()+calOff,1),y=base.getFullYear(),mo=base.getMonth(),first=(base.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),byDay={},nm={};
  const ty={};S.sessions.forEach(se=>{const k=dayKey(se.startedAt);byDay[k]=(byDay[k]||0)+sesSets(se);nm[k]=(nm[k]?nm[k]+' + ':'')+se.name;const t=sessType(se);ty[k]=ty[k]&&ty[k]!==t?'mix':t});
  let cells='';for(let i=0;i<first;i++)cells+='<span class="cd blank"></span>';
  for(let d=1;d<=dim;d++){const k=y+'-'+pad2(mo+1)+'-'+pad2(d),n=byDay[k]||0,l=n===0?'0':n<=10?'1':n<=18?'2':n<=26?'3':'4';
    cells+=`<button class="cd ${k===dayKey(Date.now())?'today':''}" data-l="${l}" ${n?`data-ty="${ty[k]}"`:''} data-act="cal-day" data-k="${k}" data-n="${n}" data-t="${esc(nm[k]||'')}" aria-label="${d}${n?' : '+esc(nm[k])+', '+n+' séries':''}">${d}</button>`}
  const title=base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const total=Object.keys(byDay).filter(k=>k.startsWith(y+'-'+pad2(mo+1))).length;
  return `<div class="sec"><span class="label">Calendrier</span><div class="card" style="padding:12px 16px"><div class="row"><button class="iconbtn sm" data-act="cal-nav" data-d="-1" aria-label="Mois précédent">‹</button><div class="sp b" style="text-align:center;text-transform:capitalize">${title}</div><button class="iconbtn sm" data-act="cal-nav" data-d="1" aria-label="Mois suivant" ${calOff>=0?'disabled style="opacity:.3"':''}>›</button></div>
   <div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<span class="dn">${x}</span>`).join('')}${cells}</div>
   <div class="legend lg" style="flex-wrap:wrap;justify-content:center;margin-top:8px"><span data-ty="push">Poussée</span><span data-ty="pull">Tirage</span><span data-ty="legs">Jambes</span><span data-ty="mix">Mixte</span></div>
   <div id="cal-info" class="small mute" style="min-height:20px;text-align:center;margin-top:8px">${total} séance${total>1?'s':''} ce mois-ci. Touche un jour pour le détail.</div></div></div>`}
const PUSHM=['pectoraux','epaules-ant','epaules-lat','triceps'],PULLM=['dos-largeur','dos-epaisseur','lombaires','trapezes','epaules-post','biceps','avant-bras'],LEGM=['quadriceps','ischios','fessiers','adducteurs','mollets'];
function balanceHTML(){
  const from=Date.now()-28*DAYMS,c={push:0,pull:0,legs:0};
  S.sessions.filter(x=>x.startedAt>=from).forEach(se=>se.entries.forEach(en=>{const e=EXMAP[en.exId];if(!e)return;const n=en.sets.filter(x=>x.type!=='warmup').length,m=e.p[0];
    if(PUSHM.includes(m))c.push+=n;else if(PULLM.includes(m))c.pull+=n;else if(LEGM.includes(m))c.legs+=n}));
  const tot=c.push+c.pull+c.legs;if(!tot)return'';const r=c.pull?c.push/c.pull:null;
  const msg=r==null?'Aucun tirage enregistré : ajoute du dos pour protéger tes épaules.':r>1.3?`Poussée/tirage ${fmtN(Math.round(r*10)/10)} : tu pousses plus que tu ne tires. Ajoute des séries de dos ou d'arrière d'épaule.`:r<0.77?`Poussée/tirage ${fmtN(Math.round(r*10)/10)} : tu tires plus que tu ne pousses.`:`Poussée/tirage ${fmtN(Math.round(r*10)/10)} : bien équilibré.`;
  return `<div class="sec"><span class="label">Équilibre · 28 derniers jours</span><div class="card" style="padding:12px 16px">${[['Poussée',c.push],['Tirage',c.pull],['Jambes',c.legs]].map(([l,v])=>`<div class="mbar"><span>${l}</span><div class="tr" role="img" aria-label="${l} : ${v} séries"><div class="fl" style="width:${v/tot*100}%"></div></div><b>${Math.round(v/tot*100)} %</b></div>`).join('')}<p class="small" style="margin:8px 0 0">${msg}</p></div></div>`}

/* ───────── Coach : règles locales ───────── */
function recovery(){const out={},now=Date.now();GROUPS.forEach(g=>out[g.l]={pct:100,last:null,sets:0,pain:false});
  S.sessions.slice().sort((a,b)=>b.startedAt-a.startedAt).forEach(se=>{muscleCounts(se).forEach(([l,n])=>{const o=out[l];if(!o)return;
    if(se.pain===l&&now-se.startedAt<7*DAYMS)o.pain=true;if(o.last||n<1)return;o.last=se.startedAt;o.sets=n;
    const rp=[].concat(...se.entries.map(en=>en.sets.filter(x=>x.rpe).map(x=>x.rpe))),ar=rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:7.5,
      need=Math.min(96,36+6*Math.max(0,n-4))+(ar>=9?12:0)+(se.energy&&se.energy<=2?12:0);
    o.need=need;o.pct=Math.max(0,Math.min(100,Math.round((now-se.startedAt)/3600000/need*100)))})});return out}

  return `**Tes objectifs**\n`+G.map(g=>{const i=goalInfo(g),n=g.exId&&EXMAP[g.exId]?EXMAP[g.exId].n:'Poids de corps';return `• ${n} (${GK[g.kind]}) : ${i.cur!=null?Math.round(i.cur):'—'} / ${g.target} · ${Math.round(i.pct*100)} % · ${i.est}`}).join('\n')}
function localCoach(text){const t=norm(text),e=lcFindEx(text);
  if(/\b(j ai fait|jai fait|on a fait|j ai termine|j ai enchaine|ma seance|seance faite|j ai fini)\b/.test(t.replace(/'/g,' '))||/\d+\s*x\s*\d+/.test(t)&&/fait|seance|aujourd/.test(t)){
    const rows=lgParse(text).filter(r=>r.exId&&r.reps);
    if(rows.length)return `J'ai compris :\n`+rows.map(r=>`• ${EXMAP[r.exId].n} : ${r.sets} × ${r.reps}${r.dur?' s':''}${r.kg?' (+'+fmtN(r.kg)+' kg)':''}`).join('\n')+`\nTu peux vérifier et enregistrer ça comme séance faite.\n\n\`\`\`log\n${text.replace(/\`/g,'')}\n\`\`\``}
  if(/douleur|mal au|mal a\b|blessur|\bgene\b|tendin|inflammation/.test(t))return 'Je ne peux pas poser de diagnostic. Si la douleur est vive, persistante ou inhabituelle, consulte un professionnel de santé. En attendant : signale la zone dans Coach > Gênes (les exercices à risque seront marqués ⚠), choisis des alternatives sans douleur et baisse les charges.';
  if(/(genere|generer|propose|cree|compose|construis|fais).*(seance|entrainement)|seance de \d|\d+\s*(min|h)\b.*seance|seance.*\d+\s*(min|h)\b/.test(t)){
    const min=Math.max(20,Math.min(120,lcMinutes(t))),f=/pouss|push/.test(t)?'push':/tirage|tirer|pull|dos/.test(t)?'pull':/jambe|leg/.test(t)?'legs':/haut du corps|upper/.test(t)?'upper':/corps entier|full/.test(t)?'full':'auto',q=/poids du corps|sans materiel/.test(t)?'body':/maison|domicile|haltere|elastique/.test(t)?'home':'all',d=genSession(min,f,q);
    return `Voici une séance de ${min} min (${f==='auto'?'muscles les mieux récupérés':{push:'poussée',pull:'tirage',legs:'jambes et abdos',upper:'haut du corps',full:'corps entier'}[f]}, ${q==='all'?'salle complète':q==='home'?'matériel léger':'poids du corps'}). Les meilleurs exercices de ta bibliothèque sont choisis en premier.\n`+lcSessionJSON(d)}
  if(/(bilan|rapport|resume).*mois|mois.*(bilan|rapport)/.test(t))return lcBilan(true);
  if(/bilan|rapport|resume|semaine/.test(t))return lcBilan(false);
  if(/analys|derniere seance|ma seance/.test(t))return lcAnalyse();
  if(/stagn|plateau|bloque|progresse pas|n avance|avance plus/.test(t))return lcStagne(e);
  if(/decharge|fatigu|epuise/.test(t)){const a=coachAdvice().find(x=>x.type==='deload');return a?`**${a.title}** : ${a.text}\nTu peux l'activer plus bas dans la page Coach.`:'Pas de signe de fatigue cumulée pour le moment. Une décharge se justifie après 6 semaines intenses ou quand l\'effort perçu monte alors que les performances baissent.'}
  if(/recuper|repos|quoi travailler|que travailler|aujourd|frais/.test(t))return lcRecup();
  if(/objectif|but\b|date/.test(t))return lcGoals();
  if(e&&/record|\bpr\b|maximum|\bmax\b/.test(t))return lcRecord(e);
  if(e&&/remplac|alternative|equivalent|prise|occupe/.test(t))return lcAlt(e);
  if(e&&/technique|comment|execut|faire|erreur|position/.test(t))return lcTech(e);
  if(e&&/charge|prochain|combien|kilo|progress|augment/.test(t))return lcSuggest(e);
  if(/poids de corps|mon poids|pese|mensur/.test(t)){const B=bodyList().filter(x=>x.kg>0);return B.length?`Poids de corps : ${fmtN(B[B.length-1].kg)} kg (${fmtD(B[B.length-1].t)})${B.length>1?`, ${B[B.length-1].kg-B[0].kg>=0?'+':''}${fmtN(Math.round((B[B.length-1].kg-B[0].kg)*10)/10)} kg depuis le début du suivi.`:'.'}`:'Aucune pesée enregistrée. Ajoute-en une dans Progrès > Suivi corporel.'}
  if(e)return lcSuggest(e)+'\n\n'+lcRecord(e);
  return 'Je réponds à partir de tes données, sans connexion. Essaie par exemple :\n• « Bilan de ma semaine » ou « bilan du mois »\n• « Analyse ma dernière séance »\n• « Génère une séance de 45 min jambes »\n• « Pourquoi je stagne au développé couché ? »\n• « Quelle charge pour le squat ? »\n• « Mes records au rowing »\n• « Remplace le leg press »\n• « Comment faire le soulevé de terre ? »\n• « Quelle récupération aujourd\'hui ? »\n• « Où j\'en suis de mes objectifs ? »'}

/* ───────── « Séance déjà faite » : saisie en texte libre ───────── */
const LG_STOP=['avec','pour','dans','mais','fait','fais','puis','seance','series','serie','reps','rep','fois','lestes','leste','kilos','kilo','apres','avant','aussi','environ','max','echec','sans','mon','mes','les','des','une','de','du','la','le','au','aux','en','et','a','d','l','j','ai'];
const lgStem=w=>w.replace(/(s|x)$/,'');
const lgToks=t=>norm(t).replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w.length>=2&&!LG_STOP.includes(w)&&!/^\d+$/.test(w)).map(lgStem);
const LG_SYN=[[/\bmuscle[ -]?ups?\b/,'muscle up'],[/\bgainage\b/,'planche gainage'],[/\bplanche\b(?!.*(copenhague|laterale|appui|ours|street|gainage))/,'planche gainage'],[/\bsquats?\b(?! (?:pistol|barre|smith|goblet|bulgare))/,'squat poids du corps'],[/\btraction(s)?\b(?!.*(supination|neutre|australienne|archer|lestee|assistee))/,'tractions pronation'],[/\bpistol\b/,'squat pistol assiste'],[/\bhspu\b|\bhandstand push[ -]?ups?\b/,'hspu mur'],[/\bdips?\b(?!.*(banc|lestee|machine))/,'dips pecs']];
function lgMatch(txt){let t=norm(txt);LG_SYN.forEach(([r,s])=>{if(r.test(t))t=t.replace(r,s)});const q=lgToks(t);if(!q.length)return[];
  return EXOS.map(e=>{const nt=lgToks(e.n+' '+e.al.join(' ')),hit=q.filter(w=>nt.includes(w)).length,own=lgToks(e.n),miss=own.filter(w=>!q.includes(w)).length;
    return{e,s:hit?hit*10-miss*2+(HIST[e.id]?1:0)+stars(e)/20:0}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.e)}
function lgParse(text){
  const out=[];String(text||'').split(/[\n;,]+|\s+(?:puis|et|ensuite|après|apres)\s+|\s\+\s/i).map(x=>x.trim()).filter(x=>x.length>1).forEach(seg=>{
    let t=norm(seg).replace(/×/g,'x').replace(/(\d)\s*[x*]\s*(\d)/g,'$1x$2'),kg=0,sets=null,reps=null,dur=false;
    let m=t.match(/(?:\+|leste(?:e|s)?\s*(?:de)?|avec|charge de)?\s*(\d+(?:[.,]\d+)?)\s*kg/);if(m){kg=parseFloat(m[1].replace(',','.'));t=t.replace(m[0],' ')}
    m=t.match(/(\d+)\s*(?:series?|sets?)\s*(?:de|d|x)?\s*(\d+)(?:\s*(s|sec|secondes?|min|minutes?))?/);
    if(m){sets=+m[1];reps=+m[2];if(m[3])dur=true;if(/^min/.test(m[3]||''))reps*=60;t=t.replace(m[0],' ')}
    else{m=t.match(/(\d+)x(\d+)(?:\s*(s|sec|secondes?|min|minutes?)\b)?/);if(m){let a=+m[1],b=+m[2];if(!m[3]&&a>8&&b<=8){const z=a;a=b;b=z}sets=a;reps=b;if(m[3]){dur=true;if(/^min/.test(m[3]))reps*=60}t=t.replace(m[0],' ')}
    else{m=t.match(/(\d+)\s*(s|sec|secondes?|min|minutes?)\b/);if(m){sets=1;reps=/^min/.test(m[2])?+m[1]*60:+m[1];dur=true;t=t.replace(m[0],' ')}
    else{m=t.match(/(\d+)\s*(?:reps?|repetitions?|fois)?\s*(?:de\s+|d\s*)?(?=[a-z])/);if(m){sets=1;reps=+m[1];t=t.replace(m[0],' ')}}}}
    const cands=lgMatch(t);if(sets==null&&!cands.length)return;
    out.push({raw:seg,exId:cands[0]?cands[0].id:null,cands:cands.slice(0,6).map(c=>c.id),sets:Math.max(1,Math.min(12,sets||3)),reps:reps||null,kg:kg||0,ok:sets!=null,dur})});
  return out}
function lgSessionFromRows(rows,name,startedAt,min){
  const entries=[];rows.filter(r=>r.exId&&r.reps).forEach(r=>{const ex=entries.find(x=>x.exId===r.exId),sets=Array.from({length:r.sets},()=>({type:'normal',kg:r.kg||0,reps:r.reps}));if(ex)ex.sets.push(...sets);else entries.push({exId:r.exId,note:'',sets})});
  return entries.length?{id:uid(),name:(name||'').trim()||'Séance street',tplId:null,startedAt,endedAt:startedAt+Math.max(5,min||45)*60000,entries,manual:true}:null}
function pastSheet(){const f=S.sheet.f,rows=lgParse(f.text);rows.forEach((r,i)=>{if(f.ovr&&f.ovr[i])r.exId=f.ovr[i]});const ok=rows.filter(r=>r.exId&&r.reps).length;

  return panel(`<div class="ptitle">Séance déjà faite</div><div class="pbody">

   ${rows.length?`<div class="sec-t label">Ce que j'ai compris</div>${rows.map((r,i)=>r.exId&&r.reps?`<div class="sumrow"><span>${esc(EXMAP[r.exId].n)}</span><span class="b">${r.sets} × ${r.reps}${r.dur?' s':''}${r.kg?' · +'+fmtN(r.kg)+' kg':''}</span></div>`:`<div class="sug warn" style="display:block;margin:6px 0"><div class="small">« ${esc(r.raw)} » : ${!r.reps?'je n\'ai pas compris les répétitions (écris par exemple 3x10).':'exercice à choisir.'}</div>${r.reps?sel(r,i):''}</div>`).join('')}`:''}
   <div class="row" style="gap:10px;margin-top:14px"><label class="small mute sp">Nom<input class="field" data-ex="name" value="${esc(f.name)}" style="margin-top:4px"></label><label class="small mute" style="width:92px">Durée (min)<input class="field" inputmode="numeric" data-ex="min" value="${esc(f.min)}" style="margin-top:4px"></label></div>
   <label class="small mute" style="display:block;margin-top:10px">Jour<select class="field" data-ex="day" style="margin-top:4px"><option value="0" ${f.day==='0'?'selected':''}>Aujourd'hui</option><option value="1" ${f.day==='1'?'selected':''}>Hier</option><option value="2" ${f.day==='2'?'selected':''}>Avant-hier</option><option value="3" ${f.day==='3'?'selected':''}>Il y a 3 jours</option></select></label></div>
   <div class="pfoot"><button class="btn primary block" data-act="past-save" ${ok?'':'disabled'}>${ok?'Enregistrer la séance ('+ok+' exercice'+(ok>1?'s':'')+')':'Enregistrer'}</button><button class="btn ghost block" data-act="sheet-close">Annuler</button></div>`,true)}

/* ───────── Rappels ───────── */
const remGet=()=>Object.assign({on:false,lead:30,qFrom:'22:00',qTo:'07:00',times:[],off:{},weigh:true,weighDay:0,weighTime:'08:00',backup:true},S.prefs.rem||{});
const hmin=t=>{const [h,m]=String(t||'0:0').split(':');return (+h||0)*60+(+m||0)};
const notifOK=()=>('Notification' in window)&&Notification.permission==='granted';
function notify(title,body,tag){try{if(!notifOK())return false;
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.showNotification)r.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(title,{body,tag})}).catch(()=>{try{new Notification(title,{body,tag})}catch(e){}})}else new Notification(title,{body,tag});return true}catch(e){return false}}
function inQuiet(r){const n=new Date(),m=n.getHours()*60+n.getMinutes(),f=hmin(r.qFrom),t=hmin(r.qTo);return f<=t?(m>=f&&m<t):(m>=f||m<t)}
function smartMsg(ref){const d=refDraft(ref);if(!d)return'';const last=S.sessions.find(x=>x.name===d.name);let s=d.name+' aujourd\'hui';

function remBanners(){const r=remGet(),pi=planInfo(),out=[],k=dayKey(Date.now());let hid={};try{hid=JSON.parse(localStorage.getItem('il-hide')||'{}')}catch(e){}
  if(pi&&!pi.done){const p=pi.p,yi=(todayIdx()+6)%7,yk=dayKey(Date.now()-DAYMS),ref=p.over&&yk in p.over?p.over[yk]:p.days[yi];
    if(ref&&refName(ref)&&Date.now()-DAYMS>=dayStart(p.created||0)&&!S.sessions.some(x=>dayKey(x.startedAt)===yk)&&!(p.seen&&p.seen[yk]))

  if(r.on&&r.weigh&&!bodyList().some(x=>Date.now()-x.t<7*DAYMS)&&todayIdx()>=r.weighDay&&!hid['w'+k])out.push(`<div class="sug warn"><span class="sp"><b>Pesée de la semaine</b> : note ton poids et tes mensurations.</span><button class="link" data-act="body-add">Noter</button><button class="link" data-act="rem-hide" data-k="w">Plus tard</button></div>`);
  let lb=0;try{lb=+localStorage.getItem('il-lastbackup')||0}catch(e){}
  if(r.on&&r.backup&&S.sessions.length>=3&&Date.now()-lb>30*DAYMS&&!hid['b'+k])out.push(`<div class="sug warn"><span class="sp"><b>Sauvegarde mensuelle</b> : exporte tes données (Profil).</span><button class="link" data-act="rem-hide" data-k="b">Plus tard</button></div>`);
  return out.join('')}
function checkReminders(){try{const r=remGet();if(!r.on||!notifOK()||inQuiet(r))return;

const DAYMS=86400000;
const pad2=n=>String(n).padStart(2,'0');

const monday=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const fmtD=ts=>new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const sesSets=se=>se.entries.reduce((a,e)=>a+e.sets.filter(x=>x.type!=='warmup').length,0);
const sesVol=se=>se.entries.reduce((a,e)=>a+volume(e.sets),0);
function weeksWith(){const m={};S.sessions.forEach(se=>{m[monday(se.startedAt)]=(m[monday(se.startedAt)]||0)+1});return m}
function streakWeeks(){const w=weeksWith();let c=0,k=monday(Date.now());if(!w[k])k=monday(k-DAYMS);
  while(w[k]){c++;k=monday(k-DAYMS)}return c}

  let h='';for(let c=0;c<W;c++)for(let r=0;r<7;r++){

const panel=(inner,tall)=>`<div class="ov"><button class="bd" data-act="sheet-close" aria-label="Fermer"></button><div class="panel ${tall?'tall':''}" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;

/* ───────── Schémas de mouvement (bonhomme articulé, vue de profil) ───────── */
const DGL={T:34,UA:19,FA:17,TH:26,SH:24},DGR=Math.PI/180;
const dgv=(a,l)=>[Math.sin(a*DGR)*l,Math.cos(a*DGR)*l],dgp=(p,v)=>[p[0]+v[0],p[1]+v[1]];
function dgik(p,t,l1,l2,dir){const dx=t[0]-p[0],dy=t[1]-p[1],d=Math.hypot(dx,dy)||1,dd=Math.min(d,l1+l2-0.01),a=(l1*l1-l2*l2+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,l1*l1-a*a)),ux=dx/d,uy=dy/d,bx=p[0]+ux*a,by=p[1]+uy*a;return[[bx-uy*h*dir,by+ux*h*dir],[p[0]+ux*dd,p[1]+uy*dd]]}
function dgsolve(q){
  const L=DGL,sh=q.sh,hip=q.hip||dgp(sh,dgv(q.t+180,L.T));let el,hd,kn,an,kn2,an2;
  if(q.arm){el=dgp(sh,dgv(q.arm[0],L.UA));hd=dgp(el,dgv(q.arm[1],L.FA))}else[el,hd]=dgik(sh,q.hand,L.UA,L.FA,q.ed||1);
  if(q.leg){kn=dgp(hip,dgv(q.leg[0],L.TH));an=dgp(kn,dgv(q.leg[1],L.SH))}else[kn,an]=dgik(hip,q.foot,L.TH,L.SH,q.kd||1);
  if(q.leg2){kn2=dgp(hip,dgv(q.leg2[0],L.TH));an2=dgp(kn2,dgv(q.leg2[1],L.SH))}else if(q.foot2)[kn2,an2]=dgik(hip,q.foot2,L.TH,L.SH,q.kd2||q.kd||1);
  const toe=q.toe||[an[0]+8,Math.min(an[1]+2,110)],toe2=an2?[an2[0]+8,Math.min(an2[1]+2,110)]:null;
  return{sh,hip,el,hd,kn,an,kn2,an2,toe,toe2,pl:q.pl,head:dgp(sh,dgv(q.t,13))}}
function dgbody(s,o){const f=n=>n.toFixed(1),P=(a,b)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"/>`;
  let h=`<g stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="${o}">`;
  if(s.an2)h+=`<g opacity=".55">${P(s.hip,s.kn2)}${P(s.kn2,s.an2)}${P(s.an2,s.toe2)}</g>`;
  h+=P(s.hip,s.sh)+P(s.hip,s.kn)+P(s.kn,s.an)+P(s.an,s.toe)+P(s.sh,s.el)+P(s.el,s.hd);
  h+=`<circle cx="${f(s.head[0])}" cy="${f(s.head[1])}" r="7" fill="var(--card)"/></g>`;return h}
function dgprop(eq,s,T,o){const f=n=>n.toFixed(1),[x,y]=s.hd,c='var(--accent)';

  if(eq==='kettlebell')return`<circle cx="${f(x)}" cy="${f(y+8)}" r="7" fill="${c}" opacity="${o}"/><path d="M${f(x-4)} ${f(y+3)}Q${f(x)} ${f(y-3)} ${f(x+4)} ${f(y+3)}" stroke="${c}" stroke-width="2" fill="none" opacity="${o}"/>`;
  if((eq==='poulie'||eq==='élastiques')&&T.anchor)return`<line x1="${f(x)}" y1="${f(y)}" x2="${T.anchor[0]}" y2="${T.anchor[1]}" stroke="${c}" stroke-width="1.8" ${eq==='élastiques'?'stroke-dasharray="4 3"':''} opacity="${o}"/><circle cx="${T.anchor[0]}" cy="${T.anchor[1]}" r="3" fill="${c}" opacity="${o}"/>`;
  if(eq==='machine')return`<circle cx="${f(x)}" cy="${f(y)}" r="4" fill="${c}" opacity="${o}"/>`;

    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Sauvegarde exportée')}catch(e){toast('Export impossible')}},
  'reset-ask'(){openSheet({k:'confirm',title:'Effacer toutes tes données ?',msg:'Séances, historique, favoris, notes et exercices perso seront supprimés. Cette action est définitive.',yes:'reset',label:'Tout effacer'})},
  reset(){const ids=S.templates.map(t=>['tpl',t.id]).concat(S.sessions.map(s=>['ses',s.id]));S.templates=[];S.sessions=[];S.prefs=defPrefs();rebuildEx();saveLocal();ids.forEach(([k,id])=>{if(!Store.coll)Store.deleted[k+'-'+id]=1;cloudDel(k+'-'+id)});persist('prefs');closeSheet();render();toast('Données effacées')},
};
function getItemSheet(){return E().draft.items[S.sheet.i]}

/* Actions qui modifient la séance : on prend un instantané avant, pour pouvoir annuler */
const MUT={'add-set':1,'type-apply':1,'set-del':1,'drop-add':1,'drop-del':1,done:1,'em-dup':1,'em-del':1,'em-ss':1,'rest-set':1,'rest-all':1,'tempo-save':1,'cycle-set':1,
  'pick-ok':()=>S.sheet&&S.sheet.sel&&S.sheet.sel.length>0,'pick-toggle':()=>S.sheet&&S.sheet.mode==='replace'};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,fn=A[act];
  if(fn){const m=MUT[act];if(E()&&m&&(m===1||m()))push();fn(el)}});
document.addEventListener('mouseover',ev=>{const h=ev.target.closest&&ev.target.closest('.hit');if(h&&S.sheet&&S.sheet.k==='prog')A.pt(h)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){if(S.sheet.back){openSheet(S.sheet.back)}else closeSheet()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='ai-model'){S.prefs.aiModel=t.value.trim()||'claude-sonnet-5-5';persist('prefs');return}
  if(t.dataset.pc&&S.sheet){S.sheet[t.dataset.pc]=+t.value;renderOv();return}
  if(t.dataset.fs&&S.sheet&&S.sheet.ses){persist('ses',S.sheet.ses);return}
  if(t.dataset.sel){S[t.dataset.sel]=t.dataset.sel==='minStars'?+t.value:t.value;render();return}
  if(t.id==='sphoto-in'&&t.files&&t.files[0]){const sid=t.dataset.sid;resizePhoto(t.files[0],src=>{const a=photosGet();a.push({id:uid(),t:Date.now(),src,sid});if(photosSet(a)){renderOv();render();toast('Photo ajoutée')}else toast('Mémoire pleine : supprime une photo')});return}
  if(t.id==='photo-in'&&t.files&&t.files[0]){resizePhoto(t.files[0],src=>{const a=photosGet();a.push({id:uid(),t:Date.now(),src});if(photosSet(a)){render();toast('Photo ajoutée')}else toast('Mémoire pleine : supprime une photo')});return}
  if(t.id==='imp'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='iron-log')throw 0;
      S.prefs=Object.assign(defPrefs(),j.prefs||{});S.templates=j.templates||[];S.sessions=j.sessions||[];rebuildEx();saveLocal();
      persist('prefs');S.templates.forEach(x=>persist('tpl',x));S.sessions.forEach(x=>persist('ses',x));render();toast('Sauvegarde importée')}catch(e){toast('Fichier non reconnu')}};r.readAsText(t.files[0])}});
/* Un seul instantané d'annulation par "passage" dans un champ */
document.addEventListener('focusin',ev=>{const t=ev.target;t._p=false;
  if(t.matches&&t.matches('.setrow .num[data-f]'))showStepper(t)});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!a.closest||!a.closest('.setwrap'))hideStepper()},150)});
/* Les boutons −/+ ne doivent pas faire perdre le focus au champ */
document.addEventListener('pointerdown',ev=>{if(ev.target.closest('.stepper,.stepper2'))ev.preventDefault()});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='pl-kg'){const v=num(t.value);S.sheet.kg=v||0;const r=$('#pl-res');if(r)r.innerHTML=platesResHTML(v||0);return}
  if(t.dataset.lgx!==undefined&&S.sheet&&S.sheet.k==='past'){S.sheet.f.ovr[+t.dataset.lgx]=t.value;renderOv();return}
  if(t.dataset.ex&&S.sheet&&S.sheet.f){S.sheet.f[t.dataset.ex]=t.value;if(S.sheet.k==='past'&&t.dataset.ex==='text'){renderOv();return}if((t.dataset.ex==='kind'&&S.sheet.k==='goal')||S.sheet.k==='cmp')renderOv();return}
  if(t.id==='ed-name'){if(!t._p){push();t._p=true}E().draft.name=t.value;dirty();return}
  if(t.id==='lib-q'){S.q=t.value;renderLibList();return}
  if(t.id==='chat-in'){chatDraft=t.value;return}
  if(t.dataset.cr&&S.sheet){S.sheet.q=t.value;return}
  if(t.id==='h-q'){histQ=t.value;histMax=15;const l=$('#h-list');if(l)l.innerHTML=histListHTML();return}
  if(t.dataset.se&&S.sheet&&S.sheet.d){const k=t.dataset.se,d=S.sheet.d;if(k==='name'||k==='note')d[k]=t.value;else{const [i,j,f]=k.split(':'),x=d.entries[+i].sets[+j],v=num(t.value);x[f]=v>0?v:(f==='kg'&&t.value.trim()!==''&&v===0?0:null)}return}
  if(t.dataset.fs&&S.sheet&&S.sheet.ses){S.sheet.ses[t.dataset.fs]=t.value||null;if(t.tagName==='SELECT')persist('ses',S.sheet.ses);return}
  if(t.id==='pick-q'){S.sheet.q=t.value;const l=$('#pick-list');if(l)l.innerHTML=pickListHTML();return}
  if(t.dataset.note){const id=t.dataset.note;if(t.value.trim())S.prefs.notes[id]=t.value;else delete S.prefs.notes[id];clearTimeout(t._tm);t._tm=setTimeout(()=>persist('prefs'),400);return}
  if(t.dataset.f&&E()){if(!t._p){push();t._p=true}
    const it=E().draft.items[+t.dataset.i],s=it.sets[+t.dataset.s],v=num(t.value);
    if(t.dataset.d!==undefined)s.drops[+t.dataset.d][t.dataset.f]=v;else s[t.dataset.f]=v;dirty();updateStats()}});

/* Réorganisation par glisser (poignées) */
document.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('[data-grip]');if(!g||!E())return;ev.preventDefault();
  const kind=g.dataset.grip,item=g.closest(kind==='ex'?'.excard':'.setwrap'),box=item.parentElement,sel=kind==='ex'?':scope > .excard':':scope > .setwrap';
  const items=[...box.querySelectorAll(sel)],rects=items.map(i=>i.getBoundingClientRect()),from=items.indexOf(item),gap=kind==='ex'?10:0,h=rects[from].height+gap,y0=ev.clientY;let to=from;
  item.classList.add('dragging');try{g.setPointerCapture(ev.pointerId)}catch(e){}
  const move=e=>{const dy=e.clientY-y0;item.style.transform=`translateY(${dy}px)`;const c=rects[from].top+rects[from].height/2+dy;
    to=items.findIndex((_,i)=>c<rects[i].top+rects[i].height);if(to<0)to=items.length-1;
    items.forEach((it,i)=>{if(it===item)return;let sh=0;if(from<to&&i>from&&i<=to)sh=-h;else if(from>to&&i>=to&&i<from)sh=h;it.style.transform=sh?`translateY(${sh}px)`:''})};
  const up=()=>{g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
    if(to!==from){push();const arr=kind==='ex'?E().draft.items:E().draft.items[+item.closest('.excard').dataset.i].sets;const [m]=arr.splice(from,1);arr.splice(to,0,m);dirty();render()}else{items.forEach(i=>i.style.transform='');item.classList.remove('dragging')}};
  g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});

/* Balayer une série vers la gauche pour la supprimer */
document.addEventListener('pointerdown',ev=>{
  const row=ev.target.closest('.setrow');if(!row||!E()||ev.target.closest('input,[data-grip]'))return;
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  const wrap=row.parentElement,x0=ev.clientX,y0=ev.clientY;let lock=false,dx=0,bg=null;
  const stop=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cancel)};
  const reset=()=>{row.classList.remove('sw');row.style.transform='';if(bg){bg.remove();bg=null}};
  const move=e=>{dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!lock){
      if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){stop();return}
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){lock=true;try{row.setPointerCapture(e.pointerId)}catch(_){}
        row.classList.add('sw');bg=document.createElement('div');bg.className='swbg';bg.textContent='Supprimer';bg.style.height=row.offsetHeight+'px';wrap.prepend(bg)}
      else return}
    const t=Math.max(-140,Math.min(0,dx));row.style.transform='translateX('+t+'px)';bg.style.opacity=String(Math.min(1,-t/70))};
  const up=()=>{stop();
    if(lock&&dx<-80){const i=+row.closest('.excard').dataset.i,k=+wrap.dataset.s;push();E().draft.items[i].sets.splice(k,1);dirty();render();toast('Série supprimée · ↶ pour annuler')}
    else reset()};
  const cancel=()=>{stop();reset()};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cancel);
});

/* ───────── Démarrage ───────── */
loadLocal();render();initCloud();

applyFs();
(function(){try{const a=new URLSearchParams(location.search).get('a');if(!a)return;history.replaceState(null,'',location.pathname);
  if(['today','sessions','prog','coach'].includes(a)){S.tab=a;render()}
  if(a==='today'){const pi=planInfo();if(pi&&!pi.done&&pi.p.days[todayIdx()]&&!S.editor&&!S.sessions.some(x=>dayKey(x.startedAt)===dayKey(Date.now())))setTimeout(()=>startPlanned(),0)}}catch(e){}})();
/* Installation hors-ligne */
setInterval(checkReminders,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});checkReminders();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
document.addEventListener('visibilitychange',()=>{const e=E();if(document.visibilityState==='visible'&&e&&e.mode==='run'){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>{});tickRest()}catch(x){}}});
window.__IL=S; /* aide au débogage */
S.dgTest=()=>EXOS.map(e=>dgHTML(e));
})();
